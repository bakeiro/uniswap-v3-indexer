type Pool {
  id: ID!
  ticks: [Tick!]! @derivedFrom(field: "pool")
}

type Tick {
  id: ID!
  pool: Pool! @index
  poolAddress: String @index
  tickIdx: BigInt! @index
  liquidityGross: BigInt!
  liquidityNet: BigInt!
  price0: BigDecimal!
  price1: BigDecimal!
  createdAtTimestamp: BigInt! @index
  createdAtBlockNumber: BigInt! @index
}
